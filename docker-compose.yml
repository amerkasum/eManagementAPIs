services: 
  #mssql docker:
    rs2app-rabbitmq:
      image: rabbitmq:3.13-management
      container_name: rs2app-rabbitmq
      restart: unless-stopped
      environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest
      ports:
        - "5672:5672"
        - "15672:15672"
      expose:
        - 5672
      networks:
        - rs2appnet
  
    rs2app-sql:
      image: mcr.microsoft.com/mssql/server:2017-latest
      restart: unless-stopped
      environment: 
        - ACCEPT_EULA=Y
        - SA_PASSWORD=Ib210322.
        - MSSQL_PID=Developer
      ports: 
        - 1433:1433
      expose: 
        - 1433
      networks: 
        - rs2appnet
    
  
    rs2app-api:
      restart: unless-stopped
      build:
        context: .
      environment:
        - ConnectionStrings__DefaultConnection=Server=rs2app-sql,1433;Database=210322Docker;User=sa;Password=Ib210322.;TrustServerCertificate=True;ConnectRetryCount=0
        - ASPNETCORE_ENVIRONMENT=Development
      ports:
        - 5269:5269
      networks:
        - rs2appnet
      links:
        - rs2app-sql
      depends_on:
        - rs2app-sql
      
    rs2app-email-service:
      restart: on-failure
      build:
        context: .
        dockerfile: Dockerfile.emailservice
      environment:
        - RABBITMQ_HOST=rs2app-rabbitmq
        - RABBITMQ_USERNAME=guest
        - RABBITMQ_PASSWORD=guest
        - RABBITMQ_VIRTUALHOST=/
       # - ASPNETCORE_ENVIRONMENT=Development  # Set the environment to Development, or 'Production' if in production
      #- SMTP_HOST=smtp.gmail.com  # Example for email service (if you're using SMTP)
      #- SMTP_PORT=587  # Example for SMTP
      #- SMTP_USERNAME=kasumamer@gmail.com
      #- SMTP_PASSWORD=wlqt yqvo cwhn ujsv
      depends_on:
        - rs2app-api
        - rs2app-sql
        - rs2app-rabbitmq
      networks:
        - rs2appnet
      ports:
        - 7101:80

    
networks:
  rs2appnet: 
    driver: bridge